[project]
name = "recovery-os"
version = "0.1.0"
description = "Bounded, self-auditing agent for AI-driven payment recovery (Razorpay buildathon, Track 3)."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "sqlmodel>=0.0.21",
    "cryptography>=42.0",
    "fastapi>=0.111",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
recovery-os = "recovery_os.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["recovery_os*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
